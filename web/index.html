<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>BraXhn TV</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top" hidden>
  <a href="#/" class="brand" aria-label="BraXhn TV hem"><img src="/icon.svg" alt=""><span>BraXhn TV</span></a>
  <nav id="libnav"></nav>
  <div class="search"><input id="q" type="search" placeholder="Sök filmer och serier" autocomplete="off"></div>
  <div class="usermenu">
    <button id="userbtn" class="ghost" aria-haspopup="true"></button>
    <div id="usermenu" class="menu" hidden>
      <a href="#/account">Mitt konto</a>
      <a href="#/stats" data-admin>Statistik och aktivitet</a>
      <a href="#/admin" data-admin>Administration</a>
      <button id="logout">Logga ut</button>
    </div>
  </div>
</header>
<main id="main"></main>
<div id="player" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
