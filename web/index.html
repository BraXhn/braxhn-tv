<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141517">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BraXhn TV">
<title>BraXhn TV</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon.png" type="image/png" sizes="256x256">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
{{importmap}}
<script src="/v/{{b}}/start.js" async fetchpriority="high"></script>
{{i18n}}
<link rel="stylesheet" href="/v/{{b}}/style.css">
<link rel="modulepreload" href="/v/{{b}}/app.js">
{{preload}}
<script type="application/json" id="moddeps">{{deps}}</script>
</head>
<body>
<a class="skiplink" href="#main" id="skiplink">Hoppa till innehållet</a>
<header id="top" hidden>
  <div class="tleft">
    <button id="railbtn" type="button" class="tbtn" aria-controls="rail" aria-expanded="false" aria-label="Visa namnen i sidomenyn" title="Sidomenyn"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
    <a href="#/" class="brand" aria-label="BraXhn TV hem"><img class="logo-full" src="/brand/logo.svg" alt="BraXhn TV"><img class="logo-mark" src="/icon.svg" alt=""></a>
    <span id="crumb" aria-hidden="true"></span>
  </div>
  <nav id="toptabs" aria-label="Sidor">
    <a href="#/" data-top="">Hem</a>
    <a href="#/watchlist" data-top="watchlist">Min lista</a>
    <a href="#/requests" data-top="requests" data-requests>Önskningar</a>
    <a href="#/stats" data-top="stats" data-admin>Statistik</a>
  </nav>
  <div class="tright">
    <div class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M10 3a7 7 0 1 0 4.2 12.6l5.1 5.1 1.4-1.4-5.1-5.1A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg><input id="q" type="search" placeholder="Sök" aria-label="Sök i hela biblioteket" autocomplete="off"></div>
    <label class="cardsize" title="Kortstorlek"><span class="sr-only">Kortstorlek</span><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg><input id="cardsize" type="range" min="90" max="220" step="5" value="125"></label>
    <div class="usermenu">
      <button id="userbtn" class="ghost" aria-expanded="false" aria-controls="usermenu" aria-label="Konto och meny"></button>
      <div id="usermenu" class="menu" hidden>
        <a href="#/profiles" data-profiles>Byt profil</a>
        <a href="#/watchlist">Min lista</a>
        <a href="#/calendar">Kommande avsnitt</a>
        <a href="#/requests" data-requests>Önskningar</a>
        <a href="#/account">Mitt konto</a>
        <a href="#/quickconnect">Godkänn inloggning på TV</a>
        <button id="install" hidden>📲 Installera som app</button>
        <a href="#/wrapped">Årssammanfattning</a>
        <a href="#/history">Min historik</a>
        <a href="#/downloads" data-dlnav>Nedladdat</a>
        <a href="#/stats" data-admin>Statistik och aktivitet</a>
        <a href="#/playstats" data-admin>Tittarstatistik</a>
        <a href="#/admin" data-admin>Administration</a>
        <button id="keyshelp">Kortkommandon <kbd>?</kbd></button>
        <button id="logout">Logga ut</button>
      </div>
    </div>
  </div>
</header>
<nav id="rail" aria-label="Bibliotek">
  <div id="libnav"></div>
  <button id="railmore" type="button" class="ri" aria-haspopup="menu" aria-expanded="false" title="Mer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg><span class="lbl">Mer</span></button>
</nav>
<main id="main" tabindex="-1"></main>
<nav id="tabbar" hidden aria-label="Meny">
  <a href="#/" data-tab=""><svg viewBox="0 0 24 24"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg><span>Hem</span></a>
  <a href="#/search" data-tab="search"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 1 0 4.2 12.6l5.1 5.1 1.4-1.4-5.1-5.1A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg><span>Sök</span></a>
  <a href="#/watchlist" data-tab="watchlist"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Min lista</span></a>
  <a href="#/account" data-tab="account"><svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg><span>Konto</span></a>
</nav>
<div id="player" hidden role="region" aria-label="Spelaren"></div>
<div id="toast" role="status" aria-live="polite" aria-atomic="true" inert></div>
<script src="/v/{{b}}/app.js" type="module"></script>
</body>
</html>
