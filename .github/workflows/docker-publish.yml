name: Bygg och publicera Docker-image
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['apps/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write        # signering utan nyckel (Sigstore)
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22' }
      - name: Tester
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && npm run verify && npm test
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/braxhn/braxhn-tv
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          provenance: mode=max   # spårbarhet: hur och var imagen byggdes (SLSA)
          sbom: true             # förteckning över allt som finns i imagen
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Signera imagen (Sigstore, utan nyckel) så att den kan verifieras:
      #   cosign verify ghcr.io/braxhn/braxhn-tv:latest --certificate-identity-regexp 'https://github.com/BraXhn/braxhn-tv/' --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Signera
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/braxhn/braxhn-tv@${DIGEST}"
