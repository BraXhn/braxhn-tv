name: Bygg och publicera Docker-image
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['apps/**', '**.md']
  # Ge ut en version: Actions → "Bygg och publicera Docker-image" → Run workflow → välj kanal.
  # Versionen tas från package.json; en tagg och en GitHub-release skapas automatiskt.
  workflow_dispatch:
    inputs:
      kanal:
        description: 'latest = stabil utgåva, beta = förhandsversion'
        type: choice
        options: [latest, beta]
        default: latest
# Kanaler: :edge vid varje push till main, :beta för förhandsversioner, :latest bara för stabila utgåvor
# (samt versionsnummer och sha-<commit> att gå tillbaka till)
permissions:
  contents: write        # tagg och release vid utgåva
  packages: write
  id-token: write        # signering utan nyckel (Sigstore)
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Kanal och version
        id: ch
        env:
          KANAL: ${{ inputs.kanal }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$KANAL" ]; then CH="$KANAL"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; if [[ "$V" == *-* ]]; then CH=beta; else CH=latest; fi
          else CH=edge; fi
          if [ "$CH" = beta ] && [[ "$V" != *-* ]]; then V="$V-beta.$GITHUB_RUN_NUMBER"; fi
          # En stabil version ges bara ut en gång – höj versionen i package.json först
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && gh release view "v$V" >/dev/null 2>&1; then
            echo "::error::Version $V finns redan som utgåva. Höj \"version\" i package.json och försök igen."; exit 1
          fi
          echo "channel=$CH" >> "$GITHUB_OUTPUT"; echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Kanal: $CH, version: $V"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }   # samma som imagen
      - name: Tester
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && npm run verify && npm test
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Röktest av själva imagen (Node 24 och Debians ffmpeg) innan något publiceras
      - name: Bygg för röktest (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: braxhn-tv:rokttest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Röktest
        run: |
          docker run -d --name rok -p 18420:8420 braxhn-tv:rokttest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18420/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18420/api/health
          curl -fsS -o /dev/null http://127.0.0.1:18420/
          sleep 4
          docker logs rok
          docker logs rok 2>&1 | grep -q 'programfiler stämmer' || { echo 'Integritetskontrollen misslyckades'; exit 1; }
          docker exec rok ffmpeg -hide_banner -f lavfi -i testsrc2=d=1 -c:v libx264 -f null - >/dev/null 2>&1
          docker rm -f rok
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/braxhn/braxhn-tv
          tags: |
            type=raw,value=edge,enable=${{ steps.ch.outputs.channel == 'edge' }}
            type=raw,value=beta,enable=${{ steps.ch.outputs.channel == 'beta' }}
            type=raw,value=latest,enable=${{ steps.ch.outputs.channel == 'latest' }}
            type=raw,value=${{ steps.ch.outputs.version }},enable=${{ steps.ch.outputs.channel != 'edge' }}
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          provenance: mode=max   # spårbarhet: hur och var imagen byggdes (SLSA)
          sbom: true             # förteckning över allt som finns i imagen
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Signera imagen (Sigstore, utan nyckel) så att den kan verifieras:
      #   cosign verify ghcr.io/braxhn/braxhn-tv:latest --certificate-identity-regexp 'https://github.com/BraXhn/braxhn-tv/' --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Signera
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/braxhn/braxhn-tv@${DIGEST}"
      # Utgåva: tagg och GitHub-release med avsnittet ur CHANGELOG.md (servern visar då "ny version finns")
      - name: Skapa release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ch.outputs.version }}
          CH: ${{ steps.ch.outputs.channel }}
        run: |
          BASE="${V%%-*}"
          awk -v v="$BASE" '$0 ~ "^## "v"( |$)" {f=1; next} f && /^## / {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Se CHANGELOG.md" > notes.md
          printf '\n\nDocker: `ghcr.io/braxhn/braxhn-tv:%s` (%s)\n' "$V" "$CH" >> notes.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "BraXhn TV $V" --notes-file notes.md $([ "$CH" = beta ] && echo --prerelease)
