name: Bygg och publicera Docker-image
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['apps/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write        # signering utan nyckel (Sigstore)
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: Tester
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && npm run verify && npm test
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/braxhn/braxhn-tv
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          provenance: mode=max   # spårbarhet: hur och var imagen byggdes (SLSA)
          sbom: true             # förteckning över allt som finns i imagen
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Signera imagen (Sigstore, utan nyckel) så att den kan verifieras:
      #   cosign verify ghcr.io/braxhn/braxhn-tv:latest --certificate-identity-regexp 'https://github.com/BraXhn/braxhn-tv/' --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Signera
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/braxhn/braxhn-tv@${DIGEST}"
