# Support: kvitterar nya ärenden. Ägarens egna ärenden godkänns direkt och tas av teamet i nästa arbetspass.
# Alla andras ärenden får ett svar om att de väntar på granskning – ingen kod skrivs förrän ägaren själv
# har satt etiketten "godkänd". Ärendets text används aldrig i kommandon här (bara nummer och avsändare).
name: Support

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  kvittera:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NR: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      AGARE: ${{ github.event.issue.user.login == github.repository_owner }}
    steps:
      - name: Kvittera ärendet
        run: |
          if [ "$AGARE" = "true" ]; then
            gh issue edit "$NR" -R "$REPO" --add-label "godkänd"
            gh issue comment "$NR" -R "$REPO" --body "Ärendet är mottaget och godkänt. Teamet tar det i nästa arbetspass och svarar här när det är rättat eller om något behöver förtydligas."
          else
            gh issue edit "$NR" -R "$REPO" --add-label "väntar på granskning"
            gh issue comment "$NR" -R "$REPO" --body "Tack! Ärendet är mottaget och väntar på granskning. / Thanks! Your report has been received and is awaiting review."
          fi

  # Etiketten "godkänd" gäller bara när ägaren själv har satt den (eller den här automatiken på ägarens eget ärende)
  vakta-godkand:
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'godkänd'
      && github.event.sender.login != github.repository_owner
      && !(github.event.sender.login == 'github-actions[bot]' && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NR: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Ta bort etiketten
        run: gh issue edit "$NR" -R "$REPO" --remove-label "godkänd"

  godkant-av-agaren:
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'godkänd'
      && github.event.sender.login == github.repository_owner
      && github.event.issue.user.login != github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NR: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Meddela att ärendet är godkänt
        run: |
          gh issue edit "$NR" -R "$REPO" --remove-label "väntar på granskning" || true
          gh issue comment "$NR" -R "$REPO" --body "Ärendet är granskat och godkänt. Teamet tar det i nästa arbetspass. / Reviewed and approved – the team will pick it up."
