name: Android-app för bil och Google TV (APK)
on:
  push:
    branches: [main]
    paths: ['apps/automotive/**', '.github/workflows/android-automotive.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.BRAXHN_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '17' }
      # Android SDK finns förinstallerat på ubuntu-latest (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with: { gradle-version: '8.9' }
      # Valfritt: egen signeringsnyckel via repo-hemligheter (annars debug-signerad)
      - name: Signeringsnyckel
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.BRAXHN_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/release.jks && echo "BRAXHN_KEYSTORE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - name: Bygg APK och AAB
        working-directory: apps/automotive
        env:
          BRAXHN_KEYSTORE_PASSWORD: ${{ secrets.BRAXHN_KEYSTORE_PASSWORD }}
          BRAXHN_KEY_ALIAS: ${{ secrets.BRAXHN_KEY_ALIAS }}
          BRAXHN_KEY_PASSWORD: ${{ secrets.BRAXHN_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: braxhn-tv-automotive
          path: |
            apps/automotive/app/build/outputs/apk/release/*.apk
            apps/automotive/app/build/outputs/bundle/release/*.aab
