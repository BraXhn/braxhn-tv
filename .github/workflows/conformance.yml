name: Testsamling (mediakonformitet)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testsamling-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Hela matrisen (Debian bookworm, samma ffmpeg som Docker-imagen)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Samma bas som Dockerfile (node:24-bookworm-slim + Debians ffmpeg) – versionerna stämmer med produktionen
    container: node:24-bookworm-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installera ffmpeg
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg && ffmpeg -hide_banner -version | head -1
      - name: Kör testsamlingen (alla källor, profiler och lägen)
        env:
          CONFORMANCE: full
          CONFORMANCE_OUT: ${{ runner.temp }}/testsamling
        run: node --disable-warning=ExperimentalWarning --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/tap.txt" test/conformance.test.js
      # Felen som anteckningar på körningen (syns direkt i GitHub och går att läsa via API:t utan loggfilerna)
      - name: Fel som anteckningar
        if: failure()
        run: node test/media/annotate.mjs "$RUNNER_TEMP/tap.txt"
      - name: Spara spellistor, ffprobe-JSON och serverlogg
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testsamling-linux
          path: ${{ runner.temp }}/testsamling
          retention-days: 14

  macos:
    name: macOS – Apples HLS-spelare (AVFoundation), mediastreamvalidator och WebKit
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - name: Installera ffmpeg
        run: brew install ffmpeg && ffmpeg -hide_banner -version | head -1
      - name: Kompilera AVFoundation-kontrollen
        run: swiftc -O test/media/AVPlayerCheck.swift -o "$RUNNER_TEMP/avcheck"
      - name: Installera Playwright med WebKit (bara för testet – servern har inga beroenden)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund --no-save playwright@1.63.0
          npx playwright install webkit
      - name: Apples HLS-verktyg (finns de?)
        run: command -v mediastreamvalidator hlsreport || echo "HTTP Live Streaming Tools saknas (kräver Apple-ID) – AVFoundation används i stället"
      - name: Spela strömmarna med AVPlayer och WebKit
        run: node test/media/apple-check.mjs --out "$RUNNER_TEMP/apple" --avplayer "$RUNNER_TEMP/avcheck" --webkit "$RUNNER_TEMP/pw" 2>&1 | tee "$RUNNER_TEMP/apple.txt"; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Fel som anteckningar
        if: failure()
        run: grep -E "FEL|fel:|Error|✗" "$RUNNER_TEMP/apple.txt" | head -10 | while IFS= read -r l; do echo "::error title=macOS::$l"; done
      - name: Spara resultat, spellistor och serverlogg
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testsamling-macos
          path: |
            ${{ runner.temp }}/apple
            !${{ runner.temp }}/apple/server/media
            !${{ runner.temp }}/apple/server/tc
          retention-days: 14
