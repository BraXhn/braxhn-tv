<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BraXhn Relay</title>
<style>
  :root { color-scheme: dark light; --bg: #111418; --fg: #e8eaed; --muted: #9aa0a6; --line: #2a2f36; --accent: #4f8cff; --bad: #e5534b; --ok: #3fb950; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f7f9; --fg: #1d2127; --muted: #5f6368; --line: #d9dce1; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 44rem; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.375rem; margin: 0 0 4px; } h2 { font-size: 1.0625rem; margin: 24px 0 8px; }
  p, li { color: var(--muted); } code { font-size: .875rem; }
  input, button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); }
  input { width: 100%; box-sizing: border-box; } button { cursor: pointer; } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); border-color: var(--bad); } .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin: 8px 0; }
  .row > div { flex: 1; min-width: 12rem; } label { display: block; font-size: .875rem; color: var(--muted); }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 8px 0; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .code { font: 600 1.5rem/1.2 ui-monospace, monospace; letter-spacing: .05em; margin: 8px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>BraXhn Relay</h1>
  <p>Fjärråtkomst till BraXhn TV utan portöppning. Här parar du hemservrar och ser deras status.</p>
  <form id="login" class="row">
    <div><label for="tok">Admintoken (RELAY_ADMIN_TOKEN)</label><input id="tok" type="password" autocomplete="current-password" required></div>
    <button class="primary">Logga in</button>
  </form>
  <p id="err" class="bad" role="alert"></p>
  <section id="app" hidden>
    <h2>Para en ny server</h2>
    <form id="newcode" class="row">
      <div><label for="host">Adress den nås på (valfritt, t.ex. tv.example.com)</label><input id="host" placeholder="lämna tomt för reläets adress"></div>
      <button class="primary">Skapa parningskod</button>
    </form>
    <div id="code" class="card" hidden aria-live="polite"></div>
    <h2>Parade servrar</h2>
    <div id="servers"></div>
    <p id="meta"></p>
  </section>
</main>
<script src="/_relay/admin.js"></script>
</body>
</html>
